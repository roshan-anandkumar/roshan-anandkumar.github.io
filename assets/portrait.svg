<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-label="Portrait placeholder for Roshan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#12060a"/>
      <stop offset="0.55" stop-color="#0b0710"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>

    <radialGradient id="keyLight" cx="0.5" cy="0.30" r="0.55">
      <stop offset="0" stop-color="#ff3d5a" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#7a0f24" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7a0f24" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="figure" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2a1016"/>
      <stop offset="0.5" stop-color="#160a10"/>
      <stop offset="1" stop-color="#0a070c"/>
    </linearGradient>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c74" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff3d5a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff3d5a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4cc9ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4cc9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4cc9ff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="800" height="1200" rx="0"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="1200" fill="url(#bg)"/>
    <rect width="800" height="1200" fill="url(#keyLight)"/>

    <!-- soft bloom behind head -->
    <ellipse cx="400" cy="380" rx="220" ry="240" fill="#ff3d5a" opacity="0.16" filter="url(#soft)"/>

    <!-- circuit / network motif -->
    <g stroke="#4cc9ff" stroke-opacity="0.16" stroke-width="1.3" fill="none">
      <path d="M60 250 H210 V170 H320"/>
      <path d="M740 320 H600 V240 H500"/>
      <path d="M60 880 H180 V960 H300"/>
      <path d="M740 820 H620 V920 H500"/>
      <path d="M120 1200 V1080"/>
      <path d="M680 1200 V1090"/>
    </g>
    <g fill="#4cc9ff" fill-opacity="0.4">
      <circle cx="320" cy="170" r="5"/><circle cx="500" cy="240" r="5"/>
      <circle cx="300" cy="960" r="5"/><circle cx="500" cy="920" r="5"/>
    </g>
    <g fill="#ff3d5a" fill-opacity="0.55">
      <circle cx="210" cy="250" r="4"/><circle cx="600" cy="320" r="4"/>
    </g>

    <!-- stylised silhouette: head + shoulders -->
    <g>
      <!-- shoulders -->
      <path d="M150 1200 C150 940 250 810 400 810 C550 810 650 940 650 1200 Z" fill="url(#figure)"/>
      <!-- neck -->
      <rect x="352" y="640" width="96" height="200" rx="40" fill="url(#figure)"/>
      <!-- head -->
      <ellipse cx="400" cy="470" rx="150" ry="182" fill="url(#figure)"/>
      <!-- rim light on the right edge -->
      <path d="M400 288 C482 288 550 372 550 470 C550 588 482 652 400 652" fill="none" stroke="url(#rim)" stroke-width="7" filter="url(#glow)"/>
      <path d="M556 830 C610 900 646 1030 650 1200" fill="none" stroke="url(#rim)" stroke-width="7" filter="url(#glow)"/>
      <!-- cool rim on the left -->
      <path d="M400 288 C318 288 250 372 250 470" fill="none" stroke="#4cc9ff" stroke-opacity="0.35" stroke-width="5"/>
    </g>

    <!-- scanning line -->
    <rect x="0" y="0" width="800" height="120" fill="url(#scan)" opacity="0.25">
      <animate attributeName="y" values="-120;1200" dur="6s" repeatCount="indefinite"/>
    </rect>

    <!-- vignette -->
    <rect width="800" height="1200" fill="url(#bg)" opacity="0.25" style="mix-blend-mode:multiply"/>
    <rect width="800" height="1200" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

    <!-- label -->
    <g font-family="ui-sans-serif, system-ui, sans-serif" text-anchor="middle">
      <text x="400" y="1040" fill="#ff5c74" font-size="26" letter-spacing="12" font-weight="700">ROSHAN</text>
      <text x="400" y="1080" fill="#8a7f88" font-size="15" letter-spacing="6">PORTRAIT PLACEHOLDER</text>
    </g>
  </g>
</svg>
