<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#16060b"/>
      <stop offset="0.55" stop-color="#0b0710"/>
      <stop offset="1" stop-color="#06060a"/>
    </linearGradient>
    <radialGradient id="amb" cx="0.5" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#e5132b" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#7a0f24" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7a0f24" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rgrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ff6070"/>
      <stop offset="0.5" stop-color="#e5132b"/>
      <stop offset="1" stop-color="#a30c20"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#amb)"/>

  <!-- soft bloom behind the mark -->
  <ellipse cx="256" cy="236" rx="120" ry="132" fill="#e5132b" opacity="0.20" filter="url(#soft)"/>

  <!-- faint cinematic rings -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#e5132b" stroke-opacity="0.10" stroke-width="1.5"/>

  <!-- the R monogram -->
  <g fill="none" stroke="url(#rgrad)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M184 372 V168"/>
    <path d="M184 168 H248 a74 74 0 0 1 0 148 H184"/>
    <path d="M238 300 L330 372"/>
  </g>

  <!-- hairline frame -->
  <rect x="1" y="1" width="510" height="510" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
</svg>
